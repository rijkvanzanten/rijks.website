{% extends "base.html" %}

{% block content %}
{{ section.content | safe }}

<h2>Newest Posts</h2>
{% set blog = get_section(path="blog/_index.md") %}
<ul>
	{% for post in blog.pages %}
	{% if loop.index <= 5 %}
	<li><a href="{{ post.permalink | safe }}">{{ post.title }}</a></li>
	{% endif %}
	{% endfor %}
</ul>

{% endblock content %}
